<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Цветные линии</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --silver:#c3c7cb; --silver-lt:#e9ecef; --silver-dk:#8a8f94;
    --frame:#b7bcc2; --cell:#cdd1d6; --ink:#2b2f36; --panel:#d6dae0;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:'Segoe UI',system-ui,sans-serif;color:var(--ink);
    background:linear-gradient(160deg,#6d7f90,#3f4d5a);
    display:flex;align-items:flex-start;justify-content:center;
    min-height:100%;padding:10px;overflow-x:hidden;
  }
  .game{
    width:100%;max-width:440px;background:var(--silver);border-radius:10px;padding:10px;
    border-top:2px solid var(--silver-lt);border-left:2px solid var(--silver-lt);
    border-bottom:2px solid var(--silver-dk);border-right:2px solid var(--silver-dk);
    box-shadow:0 12px 30px rgba(0,0,0,.35);
  }
  .title{text-align:center;font-size:18px;font-weight:800;letter-spacing:1px;color:#1b3a8a;
    text-shadow:0 1px 0 #fff;margin:2px 0 8px}

  /* ── Арена: король vs ты ── */
  .arena{position:relative;height:172px;background:linear-gradient(#aebfce,#cdd8e2 62%,#8fa2b0);
    border-radius:8px;overflow:hidden;margin-bottom:8px;
    border-top:1px solid var(--silver-lt);border-left:1px solid var(--silver-lt);
    border-bottom:1px solid var(--silver-dk);border-right:1px solid var(--silver-dk)}
  .arena::after{content:'';position:absolute;left:0;right:0;bottom:24px;height:3px;background:#7d8a97}
  .podium{position:absolute;bottom:0;top:0;width:46%}
  .podium.king{left:2%} .podium.you{right:2%}
  .fig{position:absolute;left:50%;transform:translateX(-50%);width:56px;height:62px;bottom:24px;
    transition:bottom .5s cubic-bezier(.3,.9,.3,1), transform .5s cubic-bezier(.3,.9,.3,1);z-index:2}
  .fig .kn{width:56px;height:62px;filter:drop-shadow(0 3px 2px rgba(0,0,0,.28))}
  .fig .skin{position:absolute;left:0;top:0;width:56px;height:62px;pointer-events:none;z-index:2}
  .fig .crown{position:absolute;top:-7px;left:50%;transform:translateX(-50%) scale(0);
    width:30px;height:20px;transition:transform .35s cubic-bezier(.3,1.6,.5,1);transform-origin:bottom center;
    filter:drop-shadow(0 1px 1px rgba(0,0,0,.3));z-index:3}
  .podium.king .fig .crown,.podium.champ .fig .crown{transform:translateX(-50%) scale(1)}
  /* свергнутый король: корона падает, фигура кренится */
  .podium.king.dethroned .fig{transform:translateX(-50%) rotate(-10deg)}
  .podium.king.dethroned .fig .crown{transform:translateX(-50%) translateY(14px) rotate(28deg) scale(1)}
  .podium.king.dethroned .fig .skin{opacity:.85}
  .pillar{position:absolute;left:50%;transform:translateX(-50%);bottom:24px;width:34px;
    border-radius:4px 4px 0 0;min-height:4px;z-index:1;
    transition:height .4s cubic-bezier(.3,.9,.3,1);
    background:
      repeating-linear-gradient(48deg, rgba(255,255,255,.18) 0 5px, rgba(255,255,255,0) 5px 10px),
      repeating-linear-gradient(-48deg, rgba(0,0,0,.12) 0 5px, rgba(0,0,0,0) 5px 10px),
      linear-gradient(90deg,#7c8794 0%,#c3ccd5 28%,#eef2f6 50%,#c3ccd5 72%,#7c8794 100%);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.55), 0 1px 2px rgba(0,0,0,.25)}
  .pillar::after{content:'';position:absolute;bottom:-5px;left:-7px;right:-7px;height:7px;border-radius:50%;
    background:radial-gradient(ellipse at 50% 30%,#5a6673,#313b47);opacity:.7}
  .nameplate{position:absolute;bottom:3px;left:0;right:0;text-align:center;z-index:3}
  .nameplate .nm{font-size:12px;font-weight:800;color:#15306f;max-width:100%;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 0 rgba(255,255,255,.6)}
  .nameplate .sc{font-size:11px;font-weight:700;color:#3a6; }
  .podium.king .nameplate .sc{color:#b8860b}
  .vs{position:absolute;left:50%;top:10px;transform:translateX(-50%);font-size:12px;font-weight:800;
    color:#5a6b7b;background:rgba(255,255,255,.6);border-radius:10px;padding:1px 8px;z-index:2}

  /* ── Следующие ── */
  .nextrow{display:flex;align-items:center;gap:10px;margin-bottom:9px;background:var(--panel);
    border-radius:8px;padding:6px 10px;
    border-top:1px solid var(--silver-lt);border-left:1px solid var(--silver-lt);
    border-bottom:1px solid var(--silver-dk);border-right:1px solid var(--silver-dk)}
  .nextrow .nl{font-size:11px;color:#6b7580;font-weight:600}
  .nextballs{display:flex;gap:7px}
  .pathtgl{margin-left:auto;border:none;border-radius:7px;padding:5px 9px;font-family:inherit;
    font-size:11px;font-weight:700;cursor:pointer;background:linear-gradient(#eef1f5,#d7dce2);
    color:#6b7580;border-bottom:2px solid #9aa0a6;white-space:nowrap}
  .pathtgl.on{background:linear-gradient(#3d72f0,#2d5fe0);color:#fff;border-bottom-color:#1f49b8}
  .nb{width:22px;height:22px;border-radius:50%}

  /* ── Поле ── */
  .boardwrap{background:var(--frame);padding:6px;border-radius:8px;
    border-top:2px solid var(--silver-dk);border-left:2px solid var(--silver-dk);
    border-bottom:2px solid var(--silver-lt);border-right:2px solid var(--silver-lt)}
  .board{display:grid;grid-template-columns:repeat(9,1fr);gap:2px;position:relative;touch-action:manipulation;
    background:#9aa0a7}
  .cell{aspect-ratio:1/1;background:linear-gradient(135deg,#dfe3e7,#c7ccd2);border-radius:3px;
    border-top:1px solid #f2f4f6;border-left:1px solid #f2f4f6;
    border-bottom:1px solid #a7adb4;border-right:1px solid #a7adb4;
    display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
  .ball{width:80%;height:80%;border-radius:50%;position:relative;
    box-shadow:inset 0 -3px 5px rgba(0,0,0,.35)}
  .ball::before{content:'';position:absolute;top:10%;left:13%;width:40%;height:34%;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,1),rgba(255,255,255,0) 72%)}
  /* след на маршруте (F1 «Путь») — пара маленьких ступней (подошва+пятка каждая) */
  .footstep{position:absolute;left:22%;top:22%;width:56%;height:56%;opacity:.5;pointer-events:none;
    background:
      radial-gradient(ellipse 20% 15% at 36% 28%, #5d6570 72%, transparent 74%),
      radial-gradient(ellipse 12% 9%  at 36% 47%, #5d6570 72%, transparent 74%),
      radial-gradient(ellipse 20% 15% at 64% 52%, #5d6570 72%, transparent 74%),
      radial-gradient(ellipse 12% 9%  at 64% 71%, #5d6570 72%, transparent 74%)}
  .footstep.l{transform:rotate(-12deg)}
  .footstep.r{transform:rotate(12deg)}
  .cell.sel .ball{animation:hop .5s ease-in-out infinite}
  .ball.spawn{animation:pop .22s ease-out}
  .ball.clear{animation:clear .26s ease-in forwards}
  @keyframes hop{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-16%) scale(1.04)}}
  @keyframes pop{0%{transform:scale(.1)}70%{transform:scale(1.12)}100%{transform:scale(1)}}
  @keyframes clear{0%{transform:scale(1)}100%{transform:scale(0);opacity:0}}
  #flyer{position:absolute;border-radius:50%;z-index:5;pointer-events:none;display:none}
  #flyer::before{content:'';position:absolute;top:12%;left:14%;width:34%;height:34%;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.95),rgba(255,255,255,0) 70%)}

  .controls{display:flex;gap:8px;margin-top:10px}
  .btn{flex:1;padding:11px;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;
    font-family:inherit;color:#fff;background:linear-gradient(#3d72f0,#2d5fe0);border-bottom:2px solid #1f49b8}
  .btn:active{transform:translateY(1px)}
  .btn.grey{background:linear-gradient(#e3e7ec,#c9ced4);color:#2b2f36;border-bottom:2px solid #9aa0a6}
  .tip{font-size:11px;color:#55606c;text-align:center;margin-top:8px;line-height:1.5}

  .rivals{display:flex;align-items:center;gap:8px;margin-top:9px;background:#11213f;color:#cdd8ea;
    border-radius:8px;padding:6px 10px;overflow:hidden;font-size:11px;
    border-top:1px solid #243a5e;border-bottom:1px solid #0a1525}
  .rivals .rl{font-weight:800;color:#8fb0ff;white-space:nowrap;flex-shrink:0}
  .rtrack{flex:1;overflow:hidden;position:relative}
  .rmarq{display:flex;gap:18px;white-space:nowrap;will-change:transform;padding-left:18px}
  .rmarq .rv{display:inline-flex;gap:5px;align-items:center;white-space:nowrap}
  .rmarq .rv i{font-style:normal;font-size:13px;line-height:1}
  .rmarq .rv b{color:#ffd23f;font-weight:800}

  /* ── Усиления (power-ups) ── */
  .powerbar{display:flex;gap:6px;margin-top:9px}
  .pw{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;
    padding:7px 2px;border:none;border-radius:9px;cursor:pointer;font-family:inherit;
    background:linear-gradient(#eef1f5,#d7dce2);color:#2b2f36;
    border-top:1px solid #fff;border-bottom:2px solid #9aa0a6}
  .pw:active{transform:translateY(1px)}
  .pw .ic{font-size:17px;line-height:1}
  .pw .lb{font-size:9.5px;font-weight:700}
  .pw .ct{position:absolute;top:-6px;right:-4px;min-width:17px;height:17px;border-radius:9px;
    background:#2d5fe0;color:#fff;font-size:10px;font-weight:800;display:flex;align-items:center;
    justify-content:center;padding:0 4px;box-shadow:0 1px 2px rgba(0,0,0,.3)}
  .pw.shop{background:linear-gradient(#ffd96b,#f2b705);border-bottom-color:#c98e1e;color:#5a3d00}
  .pw.active{outline:3px solid #2d5fe0;outline-offset:-1px}

  /* ── Магазин (нижняя шторка) ── */
  .sheet{position:fixed;inset:0;background:rgba(20,28,38,.72);display:none;align-items:flex-end;
    justify-content:center;z-index:25}
  .sheet.on{display:flex}
  .sheet .panel{background:var(--silver);width:100%;max-width:440px;border-radius:16px 16px 0 0;
    padding:16px 14px 20px;border-top:2px solid var(--silver-lt);max-height:88%;overflow:auto}
  .sheet h3{margin:2px 0 4px;text-align:center;color:#1b3a8a}
  .sheet .sub{text-align:center;font-size:11px;color:#55606c;margin:0 0 12px}
  .shopItem{display:flex;align-items:center;gap:10px;background:var(--panel);border-radius:10px;padding:10px;
    margin-bottom:8px;border-top:1px solid var(--silver-lt);border-bottom:1px solid var(--silver-dk)}
  .shopHead{font-size:12px;font-weight:800;color:#1b3a8a;margin:4px 2px 8px;letter-spacing:.3px}
  .shopItem .si-ic{font-size:25px;width:32px;text-align:center}
  .shopItem .si-prev{width:40px;display:flex;align-items:flex-end;justify-content:center;
    background:linear-gradient(#cdd8e2,#aebfce);border-radius:8px;padding:2px;overflow:hidden}
  .shopItem .si-tx{flex:1;min-width:0}
  .shopItem .si-tx b{display:block;font-size:13.5px;color:#2b2f36}
  .shopItem .si-tx .d{font-size:11px;color:#55606c}
  .shopItem .si-tx .si-own{font-size:11px;color:#2d7a3a;font-weight:700}
  .buyCol{display:flex;flex-direction:column;gap:6px}
  .buyBtn{border:none;border-radius:8px;padding:7px 9px;font-family:inherit;font-weight:800;font-size:12.5px;
    cursor:pointer;background:linear-gradient(#ffd96b,#f2b705);color:#5a3d00;border-bottom:2px solid #c98e1e;white-space:nowrap}
  .buyBtn.small{background:linear-gradient(#eef1f5,#d7dce2);color:#2b2f36;border-bottom-color:#9aa0a6;font-size:11px}
  .buyBtn:active{transform:translateY(1px)}
  .sheetClose{display:block;width:100%;margin-top:6px;padding:11px;border:none;border-radius:8px;
    background:#e3e7ec;font-family:inherit;font-weight:700;color:#2b2f36;cursor:pointer}

  .toast{position:fixed;left:50%;top:14px;transform:translateX(-50%) translateY(-24px);
    background:#15306f;color:#fff;padding:9px 16px;border-radius:20px;font-size:13px;font-weight:700;
    opacity:0;transition:.3s;z-index:30;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.4)}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

  .over{position:fixed;inset:0;background:rgba(20,28,38,.72);display:none;align-items:center;
    justify-content:center;padding:20px;z-index:20}
  .over.on{display:flex}
  .over .card{background:var(--silver);border-radius:12px;padding:22px;text-align:center;max-width:300px;width:100%;
    border-top:2px solid var(--silver-lt);border-left:2px solid var(--silver-lt);
    border-bottom:2px solid var(--silver-dk);border-right:2px solid var(--silver-dk)}
  .over h2{margin:6px 0 4px;color:#1b3a8a}
  .over p{margin:0 0 14px;color:#55606c;font-size:14px}
  .over .big{font-size:34px;font-weight:800;color:#1b3a8a}
</style>
</head>
<body>

<!-- Пузатые человечки (король со скипетром и претендент с мечом) + корона -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="gKing" cx="36%" cy="28%" r="78%">
      <stop offset="0" stop-color="#ff9497"/><stop offset="55%" stop-color="#e23a3f"/><stop offset="100%" stop-color="#a81c22"/>
    </radialGradient>
    <radialGradient id="gYou" cx="36%" cy="28%" r="78%">
      <stop offset="0" stop-color="#ff9cf0"/><stop offset="55%" stop-color="#d93ac8"/><stop offset="100%" stop-color="#8a1e82"/>
    </radialGradient>
    <clipPath id="clipBody"><circle cx="30" cy="31" r="23"/></clipPath>
  </defs>
  <!-- Король: красный шар-толстячок со скипетром и щитом-самоцветом -->
  <symbol id="king" viewBox="0 0 60 64">
    <ellipse cx="23" cy="57" rx="7" ry="4" fill="#9e0f16"/>
    <ellipse cx="37" cy="57" rx="7" ry="4" fill="#9e0f16"/>
    <!-- скипетр -->
    <rect x="49" y="8" width="3" height="38" rx="1.5" fill="#f2c233" stroke="#c98e1e" stroke-width="1"/>
    <path d="M50.5 4 v8 M47 7.5 h7" stroke="#f2c233" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="50.5" cy="13" r="2.6" fill="#ffe27a" stroke="#c98e1e" stroke-width=".8"/>
    <!-- тело-шар -->
    <circle cx="30" cy="31" r="23" fill="url(#gKing)" stroke="#a81c22" stroke-width="1.5"/>
    <ellipse cx="21" cy="19" rx="7.5" ry="5" fill="#fff" opacity=".5"/>
    <!-- руки -->
    <circle cx="8.5" cy="36" r="4.5" fill="#e23a3f" stroke="#a81c22" stroke-width="1.2"/>
    <circle cx="51.5" cy="40" r="4.5" fill="#e23a3f" stroke="#a81c22" stroke-width="1.2"/>
    <!-- щит-самоцвет -->
    <g transform="translate(30,44)"><path d="M0 -6 L5 0 L0 6 L-5 0 Z" fill="#ffd23f" stroke="#c98e1e" stroke-width="1"/><circle cx="0" cy="0" r="1.8" fill="#ff5a6e"/></g>
    <!-- лицо -->
    <ellipse cx="24" cy="27" rx="4.4" ry="5" fill="#fff"/><ellipse cx="36" cy="27" rx="4.4" ry="5" fill="#fff"/>
    <circle cx="25" cy="28" r="2" fill="#20242b"/><circle cx="37" cy="28" r="2" fill="#20242b"/>
    <circle cx="24.2" cy="27" r=".7" fill="#fff"/><circle cx="36.2" cy="27" r=".7" fill="#fff"/>
    <path d="M23 35 q7 5.5 14 0" stroke="#7d1418" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="17.5" cy="33" r="2.4" fill="#ff8a8d" opacity=".6"/><circle cx="42.5" cy="33" r="2.4" fill="#ff8a8d" opacity=".6"/>
  </symbol>
  <!-- Король свергнут: грустный, без скипетра (корона снимается отдельно) -->
  <symbol id="king-sad" viewBox="0 0 60 64">
    <ellipse cx="23" cy="57" rx="7" ry="4" fill="#9e0f16"/>
    <ellipse cx="37" cy="57" rx="7" ry="4" fill="#9e0f16"/>
    <circle cx="30" cy="31" r="23" fill="url(#gKing)" stroke="#a81c22" stroke-width="1.5"/>
    <ellipse cx="21" cy="19" rx="7.5" ry="5" fill="#fff" opacity=".5"/>
    <circle cx="9" cy="44" r="4.5" fill="#e23a3f" stroke="#a81c22" stroke-width="1.2"/>
    <circle cx="51" cy="44" r="4.5" fill="#e23a3f" stroke="#a81c22" stroke-width="1.2"/>
    <ellipse cx="24" cy="28" rx="4.4" ry="5" fill="#fff"/><ellipse cx="36" cy="28" rx="4.4" ry="5" fill="#fff"/>
    <circle cx="24.5" cy="30" r="2" fill="#20242b"/><circle cx="36.5" cy="30" r="2" fill="#20242b"/>
    <circle cx="23.8" cy="29.3" r=".6" fill="#fff"/><circle cx="35.8" cy="29.3" r=".6" fill="#fff"/>
    <path d="M20 23 l6 2 M40 23 l-6 2" stroke="#7d1418" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M23 39 q7 -5 14 0" stroke="#7d1418" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M27 33 q-2.2 3 0 4.4 q2.2 -1.4 0 -4.4 Z" fill="#8fd6ff" stroke="#3ba3d6" stroke-width=".5"/>
  </symbol>
  <!-- Ты: фиолетовый шар-толстячок с мечом и антенной -->
  <symbol id="you" viewBox="0 0 60 64">
    <ellipse cx="23" cy="57" rx="7" ry="4" fill="#7a1670"/>
    <ellipse cx="37" cy="57" rx="7" ry="4" fill="#7a1670"/>
    <!-- меч -->
    <rect x="7" y="4" width="4" height="28" rx="1.6" fill="#e6ecf3" stroke="#9aa6b2" stroke-width="1"/>
    <rect x="8" y="5" width="1.3" height="25" fill="#fff"/>
    <rect x="3" y="31" width="12" height="3.5" rx="1.6" fill="#f2c233" stroke="#c98e1e" stroke-width=".8"/>
    <rect x="7.5" y="34" width="3" height="6" rx="1.2" fill="#8a5a1e"/>
    <!-- антенна -->
    <path d="M37 10 q3 -6 7 -7" stroke="#a01e92" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="45" cy="2.5" r="2.4" fill="#ff9cf0" stroke="#a01e92" stroke-width="1"/>
    <!-- тело-шар -->
    <circle cx="30" cy="31" r="23" fill="url(#gYou)" stroke="#7a1670" stroke-width="1.5"/>
    <ellipse cx="21" cy="19" rx="7.5" ry="5" fill="#fff" opacity=".42"/>
    <!-- руки -->
    <circle cx="8.5" cy="37" r="4.5" fill="#d93ac8" stroke="#7a1670" stroke-width="1.2"/>
    <circle cx="51.5" cy="38" r="4.5" fill="#d93ac8" stroke="#7a1670" stroke-width="1.2"/>
    <!-- самоцвет -->
    <g transform="translate(30,44)"><path d="M0 -6 L5 0 L0 6 L-5 0 Z" fill="#8ff0ff" stroke="#2f99ab" stroke-width="1"/><circle cx="0" cy="0" r="1.8" fill="#2d5fe0"/></g>
    <!-- лицо -->
    <ellipse cx="24" cy="27" rx="4.4" ry="5" fill="#fff"/><ellipse cx="36" cy="27" rx="4.4" ry="5" fill="#fff"/>
    <circle cx="25" cy="28" r="2" fill="#20242b"/><circle cx="37" cy="28" r="2" fill="#20242b"/>
    <circle cx="24.2" cy="27" r=".7" fill="#fff"/><circle cx="36.2" cy="27" r=".7" fill="#fff"/>
    <path d="M23 35 q7 5.5 14 0" stroke="#3a2470" stroke-width="2" fill="none" stroke-linecap="round"/>
    <circle cx="17.5" cy="33" r="2.4" fill="#ff9cf0" opacity=".6"/><circle cx="42.5" cy="33" r="2.4" fill="#ff9cf0" opacity=".6"/>
  </symbol>
  <!-- ── Образы (скины-одёжки), обрезаются по телу-сфере ── -->
  <symbol id="skin-poor" viewBox="0 0 60 64"><g clip-path="url(#clipBody)">
    <rect x="4" y="38" width="52" height="20" fill="#8d8270"/>
    <rect x="4" y="38" width="52" height="3" fill="#6f6556"/>
    <rect x="33" y="45" width="7" height="6" fill="#6b5f4d"/>
    <path d="M33 45 h7 M36.5 45 v6" stroke="#4e4536" stroke-width=".7"/>
    <path d="M14 48 l4 3 M44 47 l-4 3" stroke="#6f6556" stroke-width="1" stroke-linecap="round"/>
  </g></symbol>
  <symbol id="skin-royal" viewBox="0 0 60 64"><g clip-path="url(#clipBody)">
    <rect x="4" y="38" width="52" height="20" fill="#8e1f2f"/>
    <rect x="4" y="38" width="52" height="6" fill="#f4f1ea"/>
    <circle cx="15" cy="41" r="1" fill="#2b2f36"/><circle cx="24" cy="41.5" r="1" fill="#2b2f36"/>

<script>
'use strict';
const tg = window.Telegram?.WebApp;
try { tg?.ready(); tg?.expand(); } catch(e){}
const PLAYER = (tg?.initDataUnsafe?.user?.first_name) || 'Ты';

const N=9, CELLS=N*N, SPAWN=3, MIN_LINE=5;
const COLORS=[   // палитра как в оригинале Gamos: яркие «леденцовые» цвета
  {base:'#e01b22',hi:'#ff8a8a'},{base:'#ffcf00',hi:'#fff3a0'},{base:'#17a63f',hi:'#86e59c'},
  {base:'#2730cf',hi:'#9098ff'},{base:'#11c2d6',hi:'#9bf2ff'},{base:'#e23ad8',hi:'#ffabf4'},
  {base:'#7c1414',hi:'#c86565'},
];
const ballBg=(c)=>`radial-gradient(circle at 34% 29%, ${COLORS[c].hi}, ${COLORS[c].base} 58%, #00000070 100%)`;
const $=(id)=>document.getElementById(id);
const boardEl=$('board');
const inb=(r,c)=>r>=0&&r<N&&c>=0&&c<N;

let grid, next, selected, score, over, prev;
let showPath = localStorage.getItem('cl_path')!=='0';   // F1 «Путь»: показывать маршрут (по умолчанию вкл)
function togglePath(){ showPath=!showPath; localStorage.setItem('cl_path', showPath?'1':'0'); renderPathToggle();
  toast(showPath?'🐾 Путь: вкл':'Путь: выкл'); }
function renderPathToggle(){ const b=document.getElementById('pathToggle'); if(b) b.classList.toggle('on', showPath); }
let best=+(localStorage.getItem('cl_best')||0);
let bestName=localStorage.getItem('cl_bestname')||'Чемпион';
// Глобальный рекордсмен (король стола) — общий для всех игроков, приходит с сервера
let champBest=+(localStorage.getItem('cl_champbest')||best||0);
let champName=localStorage.getItem('cl_champname')||bestName;
let tgtBest=champBest, tgtName=champName;   // кого догоняем в ТЕКУЩЕЙ партии (слева)
let wasChamp=false, busy=false;

// ── Усиления / магазин (Telegram Stars) ──
const SHOP=[
  {id:'bomb',    icon:'💣', name:'Бомба',       desc:'Убрать любой шарик с поля',          price:2, pack:5,  packPrice:8},
  {id:'shuffle', icon:'🔀', name:'Замена',      desc:'Поменять 3 следующих шарика',        price:1, pack:5,  packPrice:4},
  {id:'breather',icon:'🫧', name:'Передышка',   desc:'Один ход без досыпки новых шариков',  price:1, pack:5,  packPrice:4},
  {id:'revive',  icon:'❤️', name:'Продолжение', desc:'Очистить часть поля после проигрыша',price:3, pack:3,  packPrice:7},
];
const INVOICE_API='https://tpgbsziwiezwmhtoxfkc.supabase.co/functions/v1/colorlines/api/invoice'; // Supabase Edge Function; пусто = демо-режим
const STARTER={bomb:3, shuffle:3, breather:3, revive:3}; // подарок новому игроку
let inv = (()=>{
  const raw=localStorage.getItem('cl_inv');
  if(raw==null){ const g={...STARTER}; try{ localStorage.setItem('cl_inv',JSON.stringify(g)); }catch(e){} return g; }
  try{ return JSON.parse(raw)||{}; }catch(e){ return {}; }
})();
let bombMode=false, breatherArmed=false, freeUndoUsed=false;
function saveInv(){ try{ localStorage.setItem('cl_inv',JSON.stringify(inv)); }catch(e){} }
const have=(id)=>inv[id]||0;

// ── Образы (скины-одёжки) ──
const SKINS=[
  {id:'poor',    icon:'🧦', name:'Нищенка',         desc:'Залатанная рубаха',      price:0},
  {id:'treniki', icon:'🏃', name:'Треники',         desc:'Спортивный костюм',      price:15},
  {id:'sport',   icon:'🎽', name:'Спортивка',       desc:'Яркая майка №10',        price:15},
  {id:'frak',    icon:'🤵', name:'Фрак',            desc:'Чёрный фрак с бабочкой',  price:35},
  {id:'shuba',   icon:'🧥', name:'Шуба',            desc:'Меховая шуба',           price:50},
  {id:'royal',   icon:'👑', name:'Королевская мантия', desc:'Горностаевая мантия',  price:100},
];
let skins = (()=>{ try{ const s=JSON.parse(localStorage.getItem('cl_skins')||'null'); if(s&&Array.isArray(s.owned)) return s; }catch(e){} return {owned:['poor'], equip:'poor'}; })();
function saveSkins(){ try{ localStorage.setItem('cl_skins',JSON.stringify(skins)); }catch(e){} }
const ownsSkin=(id)=>skins.owned.includes(id);
function applySkin(){ const u=$('youSkinUse'); if(u) u.setAttribute('href','#skin-'+(skins.equip||'poor')); }
function equipSkin(id){ if(!ownsSkin(id)) return; skins.equip=id; saveSkins(); applySkin(); renderShop();
  if(typeof apiPost==='function') apiPost('/api/equip',{id}).then(s=>{ if(s&&s.skins){ skins=s.skins; saveSkins(); applySkin(); } });
  tg?.HapticFeedback?.selectionChanged?.(); toast('Надет образ: '+(SKINS.find(s=>s.id===id)?.name||id)); }
function buySkin(id){ const sk=SKINS.find(s=>s.id===id); if(!sk||ownsSkin(id)) return;
  payStars({kind:'skin', id, qty:1, title:`Образ «${sk.name}»`, stars:sk.price}, ()=>{ skins.owned.push(id); skins.equip=id; saveSkins(); applySkin(); renderShop();
    toast('🎉 Куплен образ: '+sk.name); }); }

// клетки
const cellEls=[];
for(let i=0;i<CELLS;i++){
  const d=document.createElement('div'); d.className='cell';
  d.addEventListener('click',()=>onCell(i)); boardEl.appendChild(d); cellEls.push(d);
}

function emptyCells(){const a=[];for(let i=0;i<CELLS;i++)if(grid[i]==null)a.push(i);return a;}
function randColor(){return Math.floor(Math.random()*COLORS.length);}

function newGame(){
  grid=new Array(CELLS).fill(null); next=[randColor(),randColor(),randColor()];
  selected=null; score=0; over=false; prev=null; busy=false;
  tgtBest=champBest; tgtName=champName;   // цель партии — глобальный рекорд (король стола)
  wasChamp = tgtBest<=0;
  bombMode=false; breatherArmed=false; freeUndoUsed=false;
  $('over').classList.remove('on');
  spawn(SPAWN);
  renderNext(); render(); renderArena(); renderPower(); save();
  toast('Новая игра');
}

function spawn(count){
  const empt=emptyCells(); const placed=[];
  for(let k=0;k<count&&empt.length;k++){
    const idx=empt.splice(Math.floor(Math.random()*empt.length),1)[0];
    grid[idx]=next[k%next.length]; placed.push(idx);
  }
  next=[randColor(),randColor(),randColor()]; renderNext();
  return placed;
}

// путь BFS → массив клеток (или null)
function findPath(from,to){
  if(grid[to]!=null) return null;
  const prevArr=new Int16Array(CELLS).fill(-1); const seen=new Uint8Array(CELLS);
  const q=[from]; seen[from]=1;
  while(q.length){
    const cur=q.shift(); if(cur===to) break;
    const r=(cur/N)|0,c=cur%N;
    for(const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nr=r+dr,nc=c+dc;
      if(inb(nr,nc)){const ni=nr*N+nc; if(!seen[ni]&&grid[ni]==null){seen[ni]=1;prevArr[ni]=cur;q.push(ni);}}
    }
  }
  if(!seen[to]) return null;
  const path=[]; let cur=to; while(cur!==-1){path.push(cur); if(cur===from)break; cur=prevArr[cur];}
  return path.reverse();
}

function scoreFor(len){return ({5:10,6:12,7:18,8:28,9:42})[len]||(len-2)*2;}
function findClears(){
  const toClear=new Set(); let gained=0;
  const dirs=[[0,1],[1,0],[1,1],[1,-1]];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const col=grid[r*N+c]; if(col==null)continue;
    for(const [dr,dc] of dirs){
      const pr=r-dr,pc=c-dc; if(inb(pr,pc)&&grid[pr*N+pc]===col)continue;
      let len=1,rr=r+dr,cc=c+dc; while(inb(rr,cc)&&grid[rr*N+cc]===col){len++;rr+=dr;cc+=dc;}
      if(len>=MIN_LINE){gained+=scoreFor(len); let r2=r,c2=c; for(let i=0;i<len;i++){toClear.add(r2*N+c2);r2+=dr;c2+=dc;}}
    }
  }
  return {cells:[...toClear],gained};
}

function clearCells(cells,gained){
  prev=null;                    // ход со сбором линии нельзя откатить (иначе гонка с анимацией очистки)
  cells.forEach(i=>{const b=cellEls[i].firstChild; if(b)b.classList.add('clear');});
  addScore(gained); tg?.HapticFeedback?.impactOccurred?.('medium');
  setTimeout(()=>{cells.forEach(i=>grid[i]=null); render(); save();},240);
}

function addScore(g){
  score+=g;
  if(score>best){ best=score; bestName=PLAYER;
    localStorage.setItem('cl_best',best); localStorage.setItem('cl_bestname',bestName);
    scoreToServer(); }
  const champNow = tgtBest>0 ? score>=tgtBest : score>0;
  if(champNow && !wasChamp){ wasChamp=true; crownYou(); }
  renderArena();
}
function crownYou(){
  tg?.HapticFeedback?.notificationOccurred?.('success');
  toast(tgtBest>0 ? `👑 Ты обошёл ${tgtName} — теперь ты король!`
                  : '👑 Трон был свободен — ты король!');
}

function onCell(i){
  if(over||busy) return;
  if(bombMode){                               // режим бомбы: тап по шарику — убрать его
    if(grid[i]!=null && have('bomb')>0){
      grid[i]=null; inv.bomb--; saveInv(); consumeServer('bomb');
      prev=null;                      // бомбу нельзя «откатить» (бустер уже потрачен)
      bombMode=false; selected=null; render(); renderPower(); save();
      tg?.HapticFeedback?.impactOccurred?.('heavy'); toast('💥 Шарик убран');
    } else { bombMode=false; renderPower(); toast('Отмена бомбы'); }
    return;
  }
  if(grid[i]!=null){ selected=(selected===i)?null:i; render(); tg?.HapticFeedback?.selectionChanged?.(); return; }
  if(selected==null) return;
  const path=findPath(selected,i);
  if(!path){ tg?.HapticFeedback?.notificationOccurred?.('error'); return; }
  moveBall(selected,i,path);
}

// плавное скольжение по найденному пути
function moveBall(from,to,path){
  busy=true;
  prev={grid:grid.slice(),next:next.slice(),score};
  const color=grid[from];
  grid[from]=null; render(); selected=null;
  const wrap=boardEl.getBoundingClientRect();
  const pt=(i)=>{const r=cellEls[i].getBoundingClientRect();
    return {x:r.left-wrap.left+r.width*0.11, y:r.top-wrap.top+r.height*0.11};};
  const size=cellEls[to].getBoundingClientRect().width*0.78;
  const fly=$('flyer');
  fly.style.display='block'; fly.style.width=fly.style.height=size+'px'; fly.style.background=ballBg(color);
  const pts=path.map(i=>pt(i));
  // F1 «Путь»: следы-лапки по маршруту (все клетки, кроме конечной)
  const paws=[];
  if(showPath){ for(let n=0;n<path.length-1;n++){ const pw=document.createElement('div'); pw.className='footstep '+(n%2?'r':'l'); cellEls[path[n]].appendChild(pw); paws.push(pw); } }
  fly.style.left=pts[0].x+'px'; fly.style.top=pts[0].y+'px'; fly.style.transform='translateY(0)';
  const stepMs=120;                              // время на один прыжок (клетку)
  const lift=Math.max(9, size*0.5);              // высота подскока
  let done=false, k=0;
  const finish=()=>{ if(done) return; done=true; paws.forEach(p=>p.remove()); fly.style.display='none'; fly.style.transform='translateY(0)';
    grid[to]=color; render(); afterMove(to); busy=false; };
  // Прыжки с клетки на клетку: по горизонтали линейно, по вертикали — дуга подскока
  const hop=()=>{
    if(done) return;
    if(++k>=pts.length){ finish(); return; }
    const a=pts[k-1], b=pts[k];
    fly.animate([
      { left:a.x+'px', top:a.y+'px', transform:'translateY(0)' },
      { transform:`translateY(-${lift}px)`, offset:0.5 },
      { left:b.x+'px', top:b.y+'px', transform:'translateY(0)' }
    ], { duration:stepMs, easing:'ease-out' });
    fly.style.left=b.x+'px'; fly.style.top=b.y+'px';   // итоговая позиция на клетке
    setTimeout(hop, stepMs);
  };
  setTimeout(hop, 0);
  // страховка: если таймеры затроттлены (фон) — всё равно завершим ход
  setTimeout(finish, pts.length*stepMs + 700);
}

function afterMove(){
  const cl=findClears();
  if(cl.cells.length){ clearCells(cl.cells,cl.gained); save(); return; }
  if(breatherArmed){                          // передышка: пропустить досыпку один раз
    breatherArmed=false; inv.breather=Math.max(0,have('breather')-1); saveInv(); consumeServer('breather');
    render(); renderPower(); save(); toast('🫧 Ход без досыпки'); return;
  }
  const placed=spawn(SPAWN); render();
  placed.forEach(i=>{const b=cellEls[i].firstChild; if(b)b.classList.add('spawn');});
  const cl2=findClears();
  if(cl2.cells.length){ clearCells(cl2.cells,cl2.gained); }
  else if(emptyCells().length===0){ gameOver(); }
  save();
}

function undo(){
  if(!prev||over||busy) return;
  grid=prev.grid; next=prev.next; score=prev.score; prev=null; selected=null;
  renderNext(); render(); renderArena(); save();
}

function gameOver(){
  over=true; tg?.HapticFeedback?.notificationOccurred?.('warning');
  const champ = tgtBest>0 ? score>=tgtBest : score>0;
  $('overTitle').textContent = champ ? '👑 Ты — чемпион!' : 'Игра окончена';
  $('overMsg').textContent = champ ? `Ты обошёл ${tgtName}! Рекорд теперь твой: ${best}` : `Рекорд ${tgtName}: ${tgtBest}`;
  $('finalScore').textContent=score; $('over').classList.add('on');
  const rb=$('reviveBtn');
  if(rb) rb.textContent = have('revive')>0 ? `❤️ Продолжить (есть ${have('revive')})` : '❤️ Продолжить за ⭐3';
}

// ── Рендер поля/превью ──
function render(){
  for(let i=0;i<CELLS;i++){
    const el=cellEls[i]; el.classList.toggle('sel',selected===i);
    const has=grid[i]!=null; let ball=el.firstChild;
    if(has){ if(!ball){ball=document.createElement('div');ball.className='ball';el.appendChild(ball);}
      ball.style.background=ballBg(grid[i]); }
    else if(ball){ el.removeChild(ball); }
  }
}
function renderNext(){
  const box=$('next'); box.innerHTML='';
  next.forEach(c=>{const d=document.createElement('div');d.className='nb';d.style.background=ballBg(c);box.appendChild(d);});
}

// ── Лента: реальный топ-10 с сервера, медали топ-3, бесшовная бегущая строка ──
const esc=(s)=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MEDAL=['🥇','🥈','🥉'];
function rvCell([n,s],i){ const m=i<3?`<i>${MEDAL[i]}</i> `:''; return `<span class="rv">${m}${esc(n)} <b>${s|0}</b></span>`; }
const MARQ_SPEED=90;   // px/с — чем больше, тем быстрее бежит строка
function startMarquee(box, list){
  box.getAnimations?.().forEach(a=>a.cancel());
  if(!list.length){ box.innerHTML='<span class="rv">Пока никого в топе — стань первым! 👑</span>'; return; }
  const track=box.parentElement;
  const unit=list.map(rvCell).join('');
  box.innerHTML=unit;
  const setW=box.scrollWidth, trackW=track.clientWidth||320;
  const reps=Math.max(1, Math.ceil(trackW/Math.max(setW,1)));  // блок шире трека → без «пустот» и сброса
  const per=reps*list.length;
  box.innerHTML = unit.repeat(reps).repeat(2);                 // два одинаковых блока для бесшовной петли
  const kids=box.children;
  const shift = kids[per] ? (kids[per].offsetLeft - kids[0].offsetLeft) : box.scrollWidth/2; // точный шаг петли
  const dur = Math.max(5, shift/MARQ_SPEED);
  box.animate([{transform:'translateX(0)'},{transform:`translateX(${-shift}px)`}],
    {duration:dur*1000, iterations:Infinity, easing:'linear'});
}
function renderRivals(){
  const box=$('rivals'); if(!box) return;
  box.innerHTML='';                                 // без заглушек — только реальный топ
  if(!INVOICE_API) return;
  fetch(INVOICE_API.replace(/\/api\/invoice\/?$/,'')+'/api/top').then(r=>r.json()).then(rows=>{
    if(!Array.isArray(rows)) return;
    const real=rows.filter(x=>x&&x.score>0&&x.name&&x.name!=='—').map(x=>[x.name,x.score]).slice(0,10);
    startMarquee(box, real);
  }).catch(()=>{});
}

// ── Рендер арены (король vs ты) ──
function renderArena(){
  const KMAX=78, PMIN=4, FLOOR=24, FALL=Math.round(KMAX*0.4);
  const champ = tgtBest>0 ? score>=tgtBest : score>0;
  const ratio = tgtBest>0 ? Math.min(score/tgtBest,1) : (score>0?1:0);
  const youH = PMIN+Math.round((KMAX-PMIN)*ratio);
  const kingH = champ ? FALL : KMAX;                // свергнут → столбик оседает, король падает
  $('kingPillar').style.height = kingH+'px';
  $('youPillar').style.height  = youH+'px';
  $('pKing').querySelector('.fig').style.bottom = (FLOOR+kingH-2)+'px';
  $('pYou').querySelector('.fig').style.bottom  = (FLOOR+youH-2)+'px';
  $('pYou').classList.toggle('champ', champ);        // ты — новый король (корона на тебе)
  $('pKing').classList.toggle('dethroned', champ);   // старый король падает и грустит
  const ku=$('kingUse'); if(ku) ku.setAttribute('href', champ ? '#king-sad' : '#king');
  // слева — тот, кого догоняем в этой партии; справа — ты
  $('kingName').textContent = tgtName;
  $('kingScore').textContent = tgtBest;
  $('youName').textContent = PLAYER;
  $('youScore').textContent = score;
}

let toastT;
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2600);
}

// ── Усиления: применение ──
function renderPower(){
  $('ctBomb').textContent=have('bomb');
  $('ctShuffle').textContent=have('shuffle');
  $('ctBreather').textContent=have('breather');
  $('pwBomb').classList.toggle('active', bombMode);
  $('pwBreather').classList.toggle('active', breatherArmed);
}
function usePower(id){
  if(over||busy) return;
  if(have(id)<=0){ openShop(); return; }
  if(id==='bomb'){
    bombMode=!bombMode; breatherArmed=false; renderPower();
    toast(bombMode?'💣 Выбери шарик, чтобы убрать':'Бомба выключена');
  } else if(id==='shuffle'){
    inv.shuffle--; saveInv(); consumeServer('shuffle'); next=[randColor(),randColor(),randColor()];
    renderNext(); renderPower(); save(); tg?.HapticFeedback?.selectionChanged?.(); toast('🔀 Следующие заменены');
  } else if(id==='breather'){
    breatherArmed=!breatherArmed; bombMode=false; renderPower();
    toast(breatherArmed?'🫧 Следующий ход — без досыпки':'Передышка выключена');
  }
}

// ── Магазин / оплата Stars ──
function openShop(){ renderShop(); $('shop').classList.add('on'); }
function closeShop(){ $('shop').classList.remove('on'); }
function shopHead(t){ const h=document.createElement('div'); h.className='shopHead'; h.textContent=t; return h; }
function renderShop(){
  const box=$('shopList'); box.innerHTML='';
  // Усиления (расходники)
  box.appendChild(shopHead('⚡ Усиления'));
  SHOP.forEach(s=>{
    const el=document.createElement('div'); el.className='shopItem';
    el.innerHTML=`<div class="si-ic">${s.icon}</div>
      <div class="si-tx"><b>${s.name}</b><div class="d">${s.desc}</div>
        <div class="si-own">В наличии: ${have(s.id)}</div></div>`;
    const col=document.createElement('div'); col.className='buyCol';
    const b1=document.createElement('button'); b1.className='buyBtn'; b1.textContent=`⭐ ${s.price}`;
    b1.onclick=()=>buy(s.id,1,s.price);
    const b2=document.createElement('button'); b2.className='buyBtn small'; b2.textContent=`×${s.pack} · ⭐ ${s.packPrice}`;
    b2.onclick=()=>buy(s.id,s.pack,s.packPrice);
    col.appendChild(b1); col.appendChild(b2); el.appendChild(col); box.appendChild(el);
  });
  // Образы (скины)
  box.appendChild(shopHead('👕 Образы — твой персонаж'));
  SKINS.forEach(s=>{
    const el=document.createElement('div'); el.className='shopItem';
    const owned=ownsSkin(s.id), equipped=skins.equip===s.id;
    el.innerHTML=`<div class="si-prev"><svg viewBox="0 0 60 64" width="36" height="38"><use href="#you"/><use href="#skin-${s.id}"/></svg></div>
      <div class="si-tx"><b>${s.icon} ${s.name}</b><div class="d">${s.desc}</div>
        <div class="si-own">${equipped?'● надет сейчас':(owned?'есть в гардеробе':'')}</div></div>`;
    const col=document.createElement('div'); col.className='buyCol';
    const btn=document.createElement('button');
    if(equipped){ btn.className='buyBtn small'; btn.textContent='Надет ✓'; btn.disabled=true; btn.style.opacity=.6; }
    else if(owned){ btn.className='buyBtn'; btn.textContent='Надеть'; btn.onclick=()=>equipSkin(s.id); }
    else if(s.price===0){ btn.className='buyBtn'; btn.textContent='Надеть'; btn.onclick=()=>{ skins.owned.push(s.id); equipSkin(s.id); }; }
    else { btn.className='buyBtn'; btn.textContent=`⭐ ${s.price}`; btn.onclick=()=>buySkin(s.id); }
    col.appendChild(btn); el.appendChild(col); box.appendChild(el);
  });
}
function grant(id,qty){ inv[id]=have(id)+qty; saveInv(); renderPower(); renderShop();
  const it=SHOP.find(s=>s.id===id); toast(`✅ +${qty} «${it?it.name:id}»`); }
function buy(id,qty,price,onDone){
  const it=SHOP.find(s=>s.id===id);
  payStars({kind:'power', id, qty, title:`${it.name} ×${qty}`, stars:price}, ()=>{ grant(id,qty); if(onDone)onDone(); });
}
// ── Связь с сервером (активна только при заданном INVOICE_API и запуске из Telegram) ──
const serverOn = () => !!(INVOICE_API && tg && tg.initData);
const apiBase  = () => INVOICE_API.replace(/\/api\/invoice\/?$/,'');
function apiPost(sub, extra){
  if(!serverOn()) return Promise.resolve(null);
  return fetch(apiBase()+sub,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({initData:tg.initData, ...(extra||{})})}).then(r=>r.json()).catch(()=>null);
}
function applyServerState(s){
  if(!s) return;
  if(s.inv){ inv=s.inv; saveInv(); renderPower(); }
  if(s.skins){ skins=s.skins; saveSkins(); applySkin(); }
  if(typeof s.best==='number' && s.best>best){ best=s.best; bestName=s.bestName||bestName;
    localStorage.setItem('cl_best',best); localStorage.setItem('cl_bestname',bestName); }
  // Глобальный король стола — общий рекорд по всем игрокам
  if(typeof s.champBest==='number'){
    champBest=s.champBest; champName=s.champName||champName||'Чемпион';
    localStorage.setItem('cl_champbest',champBest); localStorage.setItem('cl_champname',champName);
    if(score < champBest){ tgtBest=champBest; tgtName=champName; wasChamp=false; }  // ещё не обогнал — король = рекордсмен
    renderArena(); }
  renderShop();
}
function syncFromServer(){ apiPost('/api/state',{}).then(applyServerState); }
// После оплаты повторяем запрос: ждём, пока вебхук начислит покупку на сервере
function syncWithRetry(tries){ tries=tries||6; let n=0;
  const go=()=>{ apiPost('/api/state',{}).then(applyServerState); if(++n<tries) setTimeout(go,1300); };
  setTimeout(go,1200);
}
// Серверное списание улучшения — «потратил = сгорело» (расход виден серверу, не вернётся при синхронизации)
function consumeServer(id, delay){
  if(!serverOn()) return;
  const fire=()=>apiPost('/api/consume',{id,qty:1}).then(s=>{ if(s&&s.inv){ inv=s.inv; saveInv(); renderPower(); } });
  delay ? setTimeout(fire,delay) : fire();
}
// Отправка рекорда на сервер (с debounce, чтобы не слать на каждое очко)
let scoreT;
function scoreToServer(){
  if(!serverOn()) return;
  clearTimeout(scoreT);
  scoreT=setTimeout(()=>apiPost('/api/score',{score:best}), 800);
}

// order = {kind:'power'|'skin', id, qty, title, stars}
// onPaidDemo — локальное начисление (ТОЛЬКО демо); onAction — действие после покупки (напр. продолжить игру)
function payStars(order, onPaidDemo, onAction){
  if(serverOn() && typeof tg.openInvoice==='function'){
    apiPost('/api/invoice',{kind:order.kind, id:order.id, qty:order.qty}).then(res=>{
      const link = res && res.link;
      if(!link){ toast((res&&res.error)||'Оплата недоступна'); return; }
      tg.openInvoice(link,(status)=>{
        if(status==='paid'){ toast('✅ Оплачено, зачисляем…'); if(onAction) onAction(); syncWithRetry(6); }
      });
    });
    return;
  }
  // Демо-режим (превью / без Telegram)
  const msg=`Купить «${order.title}» за ⭐${order.stars}?\n(демо — без реальной оплаты)`;
  const inTelegram = !!(tg && tg.initData);
  const go=()=>{ if(onPaidDemo) onPaidDemo(); if(onAction) onAction(); };
  try{
    if(inTelegram && typeof tg.showConfirm==='function'){ tg.showConfirm(msg,(yes)=>{ if(yes) go(); }); return; }
  }catch(e){ /* падаем на обычный confirm */ }
  if(confirm(msg)) go();
}

// ── Продолжение после проигрыша ──
function reviveFlow(){
  if(have('revive')>0){ inv.revive--; saveInv(); renderPower(); consumeServer('revive'); doRevive(); return; }
  // купить и сразу использовать: на сервере начислится вебхуком и спишется обратно → нетто 0
  payStars({kind:'power', id:'revive', qty:1, title:'Продолжение', stars:3},
    null,
    ()=>{ doRevive(); consumeServer('revive', 3000); });
}
function doRevive(){
  const filled=[]; for(let i=0;i<CELLS;i++) if(grid[i]!=null) filled.push(i);
  for(let i=filled.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [filled[i],filled[j]]=[filled[j],filled[i]]; }
  filled.slice(0,Math.min(14,filled.length)).forEach(i=>grid[i]=null);
  over=false; prev=null; selected=null; $('over').classList.remove('on');
  render(); renderArena(); renderPower(); save();
  tg?.HapticFeedback?.notificationOccurred?.('success'); toast('❤️ Продолжаем!');
}

// ── Сохранение ──
function save(){ try{ localStorage.setItem('cl_state',JSON.stringify({grid,next,score,over,tgtBest,tgtName,wasChamp})); }catch(e){} }
function load(){
  try{ const s=JSON.parse(localStorage.getItem('cl_state')||'null');
    if(s&&Array.isArray(s.grid)&&s.grid.length===CELLS&&!s.over){
      grid=s.grid; next=s.next; score=s.score; over=false; selected=null; prev=null;
      tgtBest = (s.tgtBest!=null)?s.tgtBest:champBest; tgtName = s.tgtName||champName;
      wasChamp = (s.wasChamp!=null)?s.wasChamp:(tgtBest<=0||score>=tgtBest);
      renderNext(); render(); renderArena(); return true; }
  }catch(e){}
  return false;
}

renderRivals();
if(!load()) newGame();
renderPower();
renderPathToggle();
applySkin();
syncFromServer();   // подтянуть авторитетный баланс с сервера (работает только при заданном INVOICE_API)
</script>
